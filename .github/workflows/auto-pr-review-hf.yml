name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, edited, reopened, ready_for_review]

jobs:
  ai_review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch and diff PR against base
        run: |
          echo "📥 Fetching PR and base branch..."
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr_branch
      
          echo "📐 Generating PR diff..."
          git diff --unified=0 origin/${{ github.event.pull_request.base.ref }} pr_branch > pr_diff.txt
      
          echo "📄 PR diff:"
          cat pr_diff.txt


      - name: Extract changed lines from PR diff
        run: |
          echo "🔍 Parsing PR diff to extract changed lines..."
      
          if [ ! -s pr_diff.txt ]; then
            echo "⚠️ pr_diff.txt is missing or empty!"
            echo "[]" > changed_lines.json
            exit 0
          fi
      
          CHANGED_LINES=()
          CURRENT_FILE=""
          LINE_NUM=0
      
          while IFS= read -r line || [ -n "$line" ]; do
            # Get filename from +++ lines
            if [[ "$line" =~ ^\+\+\+ ]]; then
              CURRENT_FILE=$(echo "$line" | sed -E 's|\+\+\+ b/||')
              continue
            fi
      
            # Get starting line number from @@ header
            if [[ "$line" =~ ^@@ ]]; then
              LINE_NUM=$(echo "$line" | sed -E 's/^@@ -[0-9,]+ \+([0-9]+).*/\1/')
              LINE_NUM=$((LINE_NUM - 1)) # pre-adjust before counting added lines
              continue
            fi
      
            # If it's an added line (but not a hunk header)
            if [[ "$line" =~ ^\+[^+] ]]; then
              LINE_NUM=$((LINE_NUM + 1))
              if [[ -n "$CURRENT_FILE" ]]; then
                CHANGED_LINES+=("{\"file\": \"$CURRENT_FILE\", \"line\": $LINE_NUM}")
              fi
            elif [[ ! "$line" =~ ^- ]]; then
              LINE_NUM=$((LINE_NUM + 1))
            fi
          done < pr_diff.txt
      
          printf '%s\n' "${CHANGED_LINES[@]}" | jq -s '.' > changed_lines.json
      
          echo "✅ Final changed lines:"
          cat changed_lines.json

      - name: Check if changed_lines.json is empty
        run: |
          # Ensure changed_lines.json is not empty
          if [ ! -s changed_lines.json ] || [ "$(cat changed_lines.json)" == "[]" ]; then
            echo "⚠️ No changes detected in the diff."
            exit 0
          fi
          CHANGED=$(jq -c '.[]' changed_lines.json)
          echo "Changed lines: $CHANGED"

      - name: Call AI Model or Use Fallback
        id: ai_review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ ! -s pr_diff.txt ]; then
            echo "No changes detected."
            exit 0
          fi

          echo "Calling AI model..."
          RESPONSE=$(curl https://api.openai.com/v1/chat/completions \
            -sS \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "model": "gpt-4",
            "messages": [
              {
                "role": "system",
                "content": "You are a senior code reviewer. Given a git diff, return JSON with a 'summary' string and 'comments' array (file, line, comment)."
              },
              {
                "role": "user",
                "content": "$(head -c 10000 pr_diff.txt)"
              }
            ],
            "temperature": 0.3
          }
          EOF
          )

          echo "$RESPONSE" | jq . > openai_response.json || echo "{}" > openai_response.json

          if jq -e '.error' openai_response.json > /dev/null; then
            echo "⚠️ AI failed, using fallback."
            echo '{
              "summary": "✅ Static Review: Code looks good. A few minor suggestions.",
              "comments": [
                {
                  "file": "src/components/Button.tsx",
                  "line": 1,
                  "comment": "⚠️ Consider adding input validation1."
                }
              ]
            }' > final_review.json
          else
            jq -r '.choices[0].message.content' openai_response.json > response.txt
            cat response.txt | jq . > final_review.json || {
              echo "⚠️ AI response not in JSON, using fallback."
              echo '{
                "summary": "✅ Static Review: Code looks good. A few minor suggestions.",
                "comments": [
                  {
                    "file": "src/components/Button.tsx",
                    "line": 1,
                    "comment": "⚠️ Consider adding input validation2."
                  }
                ]
              }' > final_review.json
            }
          fi

          SUMMARY=$(jq -r '.summary' final_review.json)
          jq -c '.comments' final_review.json > inline_comments.json
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

      - name: Post Summary Comment
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            **🤖 AI Code Review Summary:**
            ${{ steps.ai_review.outputs.summary }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post Inline Comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENTS=$(cat inline_comments.json)
          echo "$COMMENTS" | jq -c '.[]' | while read -r c; do
            FILE=$(echo "$c" | jq -r '.file')
            LINE=$(echo "$c" | jq -r '.line')
            TEXT=$(echo "$c" | jq -r '.comment')
            
            gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments \
              -X POST \
              -F "body=$TEXT" \
              -F "commit_id=${{ github.event.pull_request.head.sha }}" \
              -F "path=$FILE" \
              -F "line=$LINE"
          done
