name: AI PR Reviewer (Static Response)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Extract PR info
        id: pr_info
        run: |
          echo "PR_NUMBER=$(echo ${{ github.event.pull_request.number }})" >> $GITHUB_ENV
          echo "PR_SHA=$(echo ${{ github.event.pull_request.head.sha }})" >> $GITHUB_ENV

      - name: Simulate AI Response (Static JSON)
        id: ai_review
        run: |
          cat <<EOF > review.json
          {
            "comments": [
              {
                "file": "src/utils/helpers.js",
                "line": 12,
                "comment": "Consider using optional chaining here to avoid potential runtime errors."
              },
              {
                "file": "src/components/Header.js",
                "line": 24,
                "comment": "This function could be broken into smaller units for readability."
              }
            ]
          }
          EOF

      - name: Post inline comments
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: response.json
          recreate: true

      - name: Post review using GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENTS=$(jq -c '.[]' response.json)
      
          for COMMENT in $COMMENTS; do
            FILE=$(echo "$COMMENT" | jq -r '.file')
            LINE=$(echo "$COMMENT" | jq -r '.line')
            BODY=$(echo "$COMMENT" | jq -r '.comment')
      
            echo "Posting comment on $FILE:$LINE - $BODY"
      
            gh pr comment ${{ github.event.pull_request.number }} \
              --body "$BODY" \
              --repo ${{ github.repository }}
          done
