name: AI PR Review (Hugging Face Inline Comments)

on:
  pull_request:
    types: [opened, synchronize, edited, reopened, ready_for_review]

jobs:
  ai_review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch PR Diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }} HEAD > pr_diff.txt

      - name: Call Hugging Face for Inline Comments
        id: ai_review
        env:
          HF_TOKEN: ${{ secrets.HF_API_KEY }}
        run: |
          DIFF=$(cat pr_diff.txt | head -c 2000)
          PROMPT="You are an AI code reviewer. Based on the following Git diff, return inline comments as a JSON array. Each item must contain: 'file' (filename string), 'line' (line number as integer), and 'comment' (string). Do not include any explanations or non-JSON text. Output only valid JSON.

          Here is the code diff:

          $DIFF"
          PAYLOAD=$(jq -n --arg input "$PROMPT" '{inputs: $input}')
          
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $HF_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            https://api-inference.huggingface.co/models/HuggingFaceH4/zephyr-7b-beta)

          ERROR_MESSAGE=$(echo "$RESPONSE" | jq -r 'if type == "object" and has("error") then .error else "" end')
          if [[ "$ERROR_MESSAGE" != "" ]]; then
            echo "⚠️ Detected error in response: $ERROR_MESSAGE"
            echo "📦 Falling back to static response..."
            RESPONSE=$(cat response.json)
          fi

          echo "🔍 Raw AI response:"
          echo "$RESPONSE"
          echo "$RESPONSE" > response.json

          COMMENT_JSON="$RESPONSE"
          echo "$COMMENT_JSON" | jq '.' > inline_response.json || echo "[]" > inline_response.json

      - name: Install GitHub CLI
        run: sudo apt-get install gh -y

      - name: Post Inline Comments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "🔍 Getting latest commit SHA..."
          SHA=$(git rev-parse HEAD)
          echo "Latest commit SHA: $SHA"

          echo "📄 Contents of inline_response.json:"
          cat inline_response.json

          jq '[.[] | select(.file and .line and .comment) | {
            path: .file,
            position: (.line | tonumber),
            body: .comment
          }]' inline_response.json > review_comments.json

          COMMENT_COUNT=$(jq 'length' review_comments.json)

          if [ "$COMMENT_COUNT" -eq 0 ]; then
            echo "⚠️ No valid inline comments to post. Skipping review."
            exit 0
          fi
      - name: Debug AI Output and Files
        run: |
          echo "📦 Inline Comments JSON:"
          cat inline_response.json

          echo "📦 Files changed in PR:"
          git diff --name-only origin/${{ github.event.pull_request.base.ref }} > changed_files.txt
          cat changed_files.txt

          echo "📣 Posting $COMMENT_COUNT inline comments to PR..."

          jq -n --arg commit_id "$SHA" --arg event "COMMENT" \
            --argjson comments "$(cat review_comments.json)" \
            '{commit_id: $commit_id, event: $event, comments: $comments}' > request_body.json

          gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
            -X POST \
            --input request_body.json
