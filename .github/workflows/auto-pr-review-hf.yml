name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, edited, reopened, ready_for_review]

jobs:
  ai_review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch PR Diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff --unified=0 origin/${{ github.event.pull_request.base.ref }} HEAD > pr_diff.txt
          cat pr_diff.txt

      - name: Extract changed lines from PR diff
        run: |
          echo "🔍 Parsing diff..."
      
          CHANGED_LINES=()
          FILE=""
          LINE_NUM=0
      
          if [ ! -s pr_diff.txt ]; then
            echo "⚠️ No diff found in pr_diff.txt"
            echo "[]" > changed_lines.json
            exit 0
          fi
      
          while IFS= read -r line || [ -n "$line" ]; do
            # Match new file name
            if [[ "$line" =~ ^\+\+\+ ]]; then
              FILE=$(echo "$line" | sed -E 's|\+\+\+ b/||')
            fi
      
            # Match hunk header and extract starting line number
            if [[ "$line" =~ ^@@ ]]; then
              LINE_NUM=$(echo "$line" | sed -E 's/^@@ -[0-9,]+ \+([0-9]+).*/\1/')
              ((LINE_NUM--))  # Offset to track actual line updates
              continue
            fi
      
            # Match added lines (avoid +++ metadata)
            if [[ "$line" =~ ^\+[^+] ]]; then
              ((LINE_NUM++))
              CHANGED_LINES+=("{\"file\": \"$FILE\", \"line\": $LINE_NUM}")
            elif [[ "$line" =~ ^[^-] ]]; then
              ((LINE_NUM++))
            fi
          done < pr_diff.txt
      
          # Output JSON array to file
          printf '%s\n' "${CHANGED_LINES[@]}" | jq -s '.' > changed_lines.json
      
          echo "✅ Parsed changed lines:"
          cat changed_lines.json


      - name: Check if changed_lines.json is empty
        run: |
          # Ensure changed_lines.json is not empty
          if [ ! -s changed_lines.json ] || [ "$(cat changed_lines.json)" == "[]" ]; then
            echo "⚠️ No changes detected in the diff."
            exit 0
          fi
          CHANGED=$(jq -c '.[]' changed_lines.json)
          echo "Changed lines: $CHANGED"

      - name: Post AI Review as PR Comment
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            **🤖 AI Code Review Summary:**
            ${{ steps.ai_review.outputs.review }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
