name: AI PR Review (Static Response Inline Comments)

on:
  pull_request:
    types: [opened, synchronize, edited, reopened, ready_for_review]

jobs:
  ai_review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load Static Inline Comments for POC
        run: |
          echo "📄 Loading static response from response.json..."
          
          # Extract and parse the nested stringified JSON (as in your example format)
          STRINGIFIED=$(jq -r '.[0].generated_text' response.json)
          echo "$STRINGIFIED" > inline_parsed.json

          jq '.review.comments' inline_parsed.json > inline_response.json || echo "[]" > inline_response.json

      - name: Install GitHub CLI
        run: sudo apt-get install gh -y

      - name: Post Inline Comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "🔍 Getting latest commit SHA..."
          SHA=$(git rev-parse HEAD)
          echo "Latest commit SHA: $SHA"

          echo "📄 Contents of inline_response.json:"
          cat inline_response.json

          # Create proper GitHub review comment format
          jq '[.[] | select(.file and .line and .comment) | {
            path: .file,
            position: (.line | tonumber),
            body: .comment
          }]' inline_response.json > review_comments.json

          COMMENT_COUNT=$(jq 'length' review_comments.json)

          if [ "$COMMENT_COUNT" -eq 0 ]; then
            echo "⚠️ No valid inline comments to post. Skipping review."
            exit 0
          fi

          echo "📣 Posting $COMMENT_COUNT inline comments to PR..."
          gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
            -X POST \
            -f commit_id="$SHA" \
            -f event="COMMENT" \
            --raw-field comments="$(cat review_comments.json | jq -c '.')"
