name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, edited, reopened, ready_for_review]

jobs:
  ai_review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch PR Diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff --unified=0 origin/${{ github.event.pull_request.base.ref }} HEAD > pr_diff.txt
          cat pr_diff.txt

      - name: Extract changed lines from PR diff
        run: |
          echo "🔍 Parsing PR diff to extract changed lines..."
      
          if [ ! -s pr_diff.txt ]; then
            echo "⚠️ pr_diff.txt is missing or empty!"
            echo "[]" > changed_lines.json
            exit 0
          fi
      
          CHANGED_LINES=()
          CURRENT_FILE=""
          LINE_NUM=0
      
          while IFS= read -r line || [ -n "$line" ]; do
            # Get filename from +++ lines
            if [[ "$line" =~ ^\+\+\+ ]]; then
              CURRENT_FILE=$(echo "$line" | sed -E 's|\+\+\+ b/||')
              continue
            fi
      
            # Get starting line number from @@ header
            if [[ "$line" =~ ^@@ ]]; then
              LINE_NUM=$(echo "$line" | sed -E 's/^@@ -[0-9,]+ \+([0-9]+).*/\1/')
              LINE_NUM=$((LINE_NUM - 1)) # pre-adjust before counting added lines
              continue
            fi
      
            # If it's an added line (but not a hunk header)
            if [[ "$line" =~ ^\+[^+] ]]; then
              LINE_NUM=$((LINE_NUM + 1))
              if [[ -n "$CURRENT_FILE" ]]; then
                CHANGED_LINES+=("{\"file\": \"$CURRENT_FILE\", \"line\": $LINE_NUM}")
              fi
            elif [[ ! "$line" =~ ^- ]]; then
              LINE_NUM=$((LINE_NUM + 1))
            fi
          done < pr_diff.txt
      
          printf '%s\n' "${CHANGED_LINES[@]}" | jq -s '.' > changed_lines.json
      
          echo "✅ Final changed lines:"
          cat changed_lines.json

      - name: Check if changed_lines.json is empty
        run: |
          # Ensure changed_lines.json is not empty
          if [ ! -s changed_lines.json ] || [ "$(cat changed_lines.json)" == "[]" ]; then
            echo "⚠️ No changes detected in the diff."
            exit 0
          fi
          CHANGED=$(jq -c '.[]' changed_lines.json)
          echo "Changed lines: $CHANGED"

      - name: Post AI Review as PR Comment
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            **🤖 AI Code Review Summary:**
            ${{ steps.ai_review.outputs.review }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post inline comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "💬 Posting inline comments..."
      
          EXISTING_COMMENTS=$(gh pr view ${{ github.event.pull_request.number }} --json comments -q '.comments[].body')
          CHANGED=$(jq -c '.[]' changed_lines.json)
      
          jq -c '.review.comments[]' openai_response.json | while read -r comment; do
            FILE=$(echo "$comment" | jq -r '.file')
            LINE=$(echo "$comment" | jq -r '.line')
            BODY=$(echo "$comment" | jq -r '.comment')
      
            # Only post if file and line are in changed_lines.json
            MATCH_FOUND=false
            for CHANGE in $CHANGED; do
              CHANGED_FILE=$(echo "$CHANGE" | jq -r '.file')
              CHANGED_LINE=$(echo "$CHANGE" | jq -r '.line')
      
              if [[ "$FILE" == "$CHANGED_FILE" && "$LINE" -eq "$CHANGED_LINE" ]]; then
                MATCH_FOUND=true
                break
              fi
            done
      
            if $MATCH_FOUND; then
              # Prevent duplicates
              if echo "$EXISTING_COMMENTS" | grep -F "$BODY" > /dev/null; then
                echo "⚠️ Skipping duplicate comment on $FILE:$LINE"
              else
                echo "💬 Commenting on $FILE:$LINE"
                gh pr comment ${{ github.event.pull_request.number }} \
                  --body "$BODY" \
                  --body-file <(echo "$BODY") \
                  --repo "${{ github.repository }}" \
                  --body "$BODY" \
                  --path "$FILE" \
                  --position "$LINE"
              fi
            fi
          done

