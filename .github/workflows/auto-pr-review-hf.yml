name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, edited, reopened, ready_for_review]

jobs:
  ai_review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch PR Diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff --unified=0 origin/${{ github.event.pull_request.base.ref }} HEAD > pr_diff.txt
          cat pr_diff.txt

      - name: Extract changed lines from PR diff
        shell: bash
        run: |
          echo "🔍 Parsing diff..."
      
          if [ ! -f pr_diff.txt ] || [ ! -s pr_diff.txt ]; then
            echo "⚠️ pr_diff.txt is missing or empty!"
            echo "[]" > changed_lines.json
            exit 0
          fi
      
          CHANGED_LINES=()
          FILE=""
          LINE_NUM=0
      
          while IFS= read -r line || [ -n "$line" ]; do
            # Detect file name
            if [[ "$line" =~ ^\+\+\+ ]]; then
              FILE=$(echo "$line" | sed -E 's|\+\+\+ b/||')
              echo "📄 Found file: $FILE"
              continue
            fi
      
            # Detect hunk header and extract new file line number
            if [[ "$line" =~ ^@@ ]]; then
              LINE_NUM=$(echo "$line" | sed -E 's/^@@ -[0-9,]+ \+([0-9]+).*/\1/')
              ((LINE_NUM--))  # Pre-offset
              echo "🔢 Hunk starts at line: $LINE_NUM"
              continue
            fi
      
            # Count lines
            if [[ "$line" =~ ^\+[^+] ]]; then
              ((LINE_NUM++))
              echo "➕ Added line $LINE_NUM in $FILE"
              CHANGED_LINES+=("{\"file\": \"$FILE\", \"line\": $LINE_NUM}")
            elif [[ "$line" =~ ^[^-] ]]; then
              ((LINE_NUM++))
            fi
          done < pr_diff.txt
      
          # Save changed lines to JSON
          printf '%s\n' "${CHANGED_LINES[@]}" | jq -s '.' > changed_lines.json || echo "[]" > changed_lines.json
      
          echo "✅ Final changed lines:"
          cat changed_lines.json

      - name: Check if changed_lines.json is empty
        run: |
          # Ensure changed_lines.json is not empty
          if [ ! -s changed_lines.json ] || [ "$(cat changed_lines.json)" == "[]" ]; then
            echo "⚠️ No changes detected in the diff."
            exit 0
          fi
          CHANGED=$(jq -c '.[]' changed_lines.json)
          echo "Changed lines: $CHANGED"

      - name: Post AI Review as PR Comment
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            **🤖 AI Code Review Summary:**
            ${{ steps.ai_review.outputs.review }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
