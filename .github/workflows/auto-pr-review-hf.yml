name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, edited, reopened, ready_for_review]

jobs:
  ai_review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch PR Diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff --unified=0 origin/${{ github.event.pull_request.base.ref }} HEAD > pr_diff.txt
          cat pr_diff.txt

      - name: Extract changed lines from PR diff
        shell: bash
        run: |
          echo "🔍 Parsing diff..."
      
          if [ ! -s pr_diff.txt ]; then
            echo "⚠️ pr_diff.txt is missing or empty!"
            echo "[]" > changed_lines.json
            exit 0
          fi
      
          CHANGED_LINES=()
          FILE=""
          LINE_NUM=0
          CURRENT_LINE=0
          ADDED_LINE=0
      
          while IFS= read -r line || [ -n "$line" ]; do
            # Detect file path
            if [[ "$line" =~ ^\+\+\+ ]]; then
              FILE=$(echo "$line" | sed -E 's|\+\+\+ b/||')
              continue
            fi
      
            # Detect hunk header, get starting line number of new file
            if [[ "$line" =~ ^@@ ]]; then
              LINE_NUM=$(echo "$line" | sed -nE 's/^@@ -[0-9,]+ \+([0-9]+).*/\1/p')
              CURRENT_LINE=$LINE_NUM
              continue
            fi
      
            # Only consider added lines (not hunk headers or file names)
            if [[ "$line" =~ ^\+[^+] ]]; then
              CHANGED_LINES+=("{\"file\": \"$FILE\", \"line\": $CURRENT_LINE}")
            fi
      
            # Update line number for both added and unchanged lines
            if [[ ! "$line" =~ ^- ]]; then
              ((CURRENT_LINE++))
            fi
          done < pr_diff.txt
      
          printf '%s\n' "${CHANGED_LINES[@]}" | jq -s '.' > changed_lines.json || echo "[]" > changed_lines.json
          echo "✅ Final changed lines:"
          cat changed_lines.json

      - name: Check if changed_lines.json is empty
        run: |
          # Ensure changed_lines.json is not empty
          if [ ! -s changed_lines.json ] || [ "$(cat changed_lines.json)" == "[]" ]; then
            echo "⚠️ No changes detected in the diff."
            exit 0
          fi
          CHANGED=$(jq -c '.[]' changed_lines.json)
          echo "Changed lines: $CHANGED"

      - name: Post AI Review as PR Comment
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            **🤖 AI Code Review Summary:**
            ${{ steps.ai_review.outputs.review }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
