name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, edited, reopened, ready_for_review]

jobs:
  ai_review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch PR Diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff --unified=0 origin/${{ github.event.pull_request.base.ref }} HEAD > pr_diff.txt
          cat pr_diff.txt

      - name: Parse diff and extract changed lines
        run: |
          # Ensure pr_diff.txt is not empty
          if [ ! -f pr_diff.txt ] || [ ! -s pr_diff.txt ]; then
            echo "⚠️ No changes detected in PR."
            exit 0
          fi

          # Create or clear changed_lines.json if any changes are detected
          echo "[]" > changed_lines.json

          # Parse the diff and identify added lines
          grep -E '^\+' pr_diff.txt | grep -v '^\+\+\+' | grep -v '^\+@@' | while read -r line; do
            FILE=$(echo "$line" | awk -F ':' '{print $1}')
            LINE=$(echo "$line" | awk -F ':' '{print $2}')
            if [ ! -z "$FILE" ] && [ ! -z "$LINE" ]; then
              echo "{\"file\": \"$FILE\", \"line\": $LINE}" >> changed_lines.json
            fi
          done

          # Print changed lines for debugging
          cat changed_lines.json

      - name: Check if changed_lines.json is empty
        run: |
          # Ensure changed_lines.json is not empty
          if [ ! -s changed_lines.json ] || [ "$(cat changed_lines.json)" == "[]" ]; then
            echo "⚠️ No changes detected in the diff."
            exit 0
          fi
          CHANGED=$(jq -c '.[]' changed_lines.json)
          echo "Changed lines: $CHANGED"

      - name: Post AI Review as PR Comment
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            **🤖 AI Code Review Summary:**
            ${{ steps.ai_review.outputs.review }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
