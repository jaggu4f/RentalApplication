name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run AI model and save raw response
        run: |
          curl -X POST https://api-inference.huggingface.co/models/YOUR_MODEL \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"inputs": "You are an AI code reviewer. Review the following PR..."}' \
            > hf_output.txt

      - name: Extract review JSON
        id: extract
        run: node parse-review.js

      - name: Print extracted review
        run: echo "🔍 Extracted Review JSON: ${{ steps.extract.outputs.review_json }}"

      # (Optional) Step to post review comment to PR
      - name: Comment on PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🤖 AI Code Review:
            ```
            ${{ steps.extract.outputs.review_json }}
            ```
