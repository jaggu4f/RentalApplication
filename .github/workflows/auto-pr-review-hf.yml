name: AI PR Review with Inline Comments

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai_review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get base branch
        id: base
        run: echo "BASE_REF=${{ github.event.pull_request.base.sha }}" >> $GITHUB_ENV

      - name: Fetch PR diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }} HEAD --unified=0 > pr.diff

      - name: Simulate AI Review Output
        id: ai_review
        run: |
          cat <<EOF > inline_response.json
          {
            "review": {
              "summary": "✅ Overall review is good. Suggestions are listed inline.",
              "comments": [
                {
                  "file": "src/helpers.ts",
                  "line": 3,
                  "comment": "⚠️ **Implicit `any` type** – The `date` parameter should have an explicit type annotation.\n\n💡 Suggested:\n```ts\nexport const formatDate = (date: string | number | Date): string => {\n  return new Date(date).toLocaleDateString();\n};\n```"
                }
              ]
            }
          }
          EOF

      - name: Install GitHub CLI
        run: sudo apt-get install gh -y

      - name: Fetch existing comments
        id: fetch_comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments > existing_comments.json

      - name: Filter duplicates
        id: filter_duplicates
        run: |
          jq -n \
            --slurpfile ai inline_response.json \
            --slurpfile existing existing_comments.json '
            [ $ai[0].review.comments[] | select(
              ($existing[0][]? | select(
                .path == .file and 
                .original_position == (.line | tonumber) and 
                .body == .comment
              )) | not
            ) | {
              path: .file,
              line: .line,
              body: .comment
            } ]' > filtered_comments.json

      - name: Print diff file
        run: cat pr.diff
        
      - name: Debug filtered comments
        run: cat filtered_comments.json
        
      - name: Map lines to diff positions
        id: map_positions
        run: |
          echo "🔍 Mapping AI comments to diff positions..."
      
          git diff origin/${{ github.event.pull_request.base.ref }} HEAD --unified=10 > patch.diff
      
          > final_comments.json
      
          jq -c '.[]' filtered_comments.json | while read -r comment; do
            FILE=$(echo "$comment" | jq -r '.path')
            LINE=$(echo "$comment" | jq -r '.position')
            BODY=$(echo "$comment" | jq -r '.body')
      
            # Find position in PR diff using `gh pr diff`
            POSITION=$(gh pr diff ${{ github.event.pull_request.number }} --path="$FILE" --patch \
              | grep -n -A10 "^@@ " \
              | grep -B10 "^+$(sed 's/[][\.*^$(){}?+|/]/\\&/g' <<< "$(sed -n "${LINE}p" "$FILE")")" \
              | head -n1 | cut -d: -f1)
      
            if [ -n "$POSITION" ]; then
              echo "{ \"path\": \"$FILE\", \"position\": $LINE, \"body\": \"$BODY\" }" >> final_comments.json
            fi
          done
      
          if [ -s final_comments.json ]; then
            echo "[" > filtered_positions.json
            sed '$!s/$/,/' final_comments.json >> filtered_positions.json
            echo "]" >> filtered_positions.json
          else
            echo "[]" > filtered_positions.json
          fi
      
          echo "✅ Final mapped comments:"
          cat filtered_positions.json



      - name: Post inline comments
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENTS=$(cat final_comments.json)
          if [ "$(jq length <<< "$COMMENTS")" -eq 0 ]; then
            echo "✅ No new inline comments to post."
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg commit_id "${{ github.event.pull_request.head.sha }}" \
            --argjson comments "$COMMENTS" \
            '{
              commit_id: $commit_id,
              event: "COMMENT",
              comments: $comments
            }')

          echo "$PAYLOAD" > payload.json

          gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
            --method POST \
            --input payload.json

      - name: Post AI Review Summary
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            🤖 **AI Code Review Summary**
            ${{ fromJson(steps.ai_review.outputs.review || '{"review": { "summary": "✅ No issues found." }}').review.summary }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
