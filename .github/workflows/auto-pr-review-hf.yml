name: PR Auto Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Load JSON and extract comments
        run: |
          echo "Reading response.json"
          python3 <<EOF
          import json

          with open("response.json", "r") as f:
              data = json.load(f)

          comments = data["generated_text"]["review"]["comments"]

          for comment in comments:
              file = comment["file"]
              line = comment["line"]
              text = comment["comment"]

              print(f"::notice file={file},line={line}::{text}")
          EOF
