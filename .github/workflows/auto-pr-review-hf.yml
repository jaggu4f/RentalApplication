name: AI PR Review (Hugging Face Inline Comments)

on:
  pull_request:
    types: [opened, synchronize, edited, reopened, ready_for_review]

jobs:
  ai_review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch PR Diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }} HEAD > pr_diff.txt

      - name: Call Hugging Face for Inline Comments
        id: ai_review
        env:
          HF_TOKEN: ${{ secrets.HF_API_KEY }}
        run: |
          DIFF=$(cat pr_diff.txt | head -c 4000) # limit size
          PAYLOAD=$(jq -n --arg input "Analyze the following code diff and suggest inline comments in JSON format with keys: file, line, comment. Only provide useful, concise code review comments.\n\n$DIFF" '{inputs: $input}')
          
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $HF_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            https://api-inference.huggingface.co/models/HuggingFaceH4/zephyr-7b-beta)

          echo "$RESPONSE" > response.json
          
          # Extract list of comment objects
          echo "$RESPONSE" | jq -r '.[]? // .generated_text // .output' > inline_comments.txt

          # Try to parse the JSON array from model output
          grep -oP '\[\s*{.*}\s*\]' inline_comments.txt > inline_response.json || echo "[]" > inline_response.json

      - name: Install GitHub CLI
        run: sudo apt-get install gh -y

      - name: Post Inline Comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(git rev-parse HEAD)
          echo "Latest commit SHA: $SHA"

          # Convert AI response to GitHub review comments
          COMMENTS_JSON=$(jq '[.[] | select(.file and .line and .comment) | {
            path: .file,
            position: (.line | tonumber),
            body: .comment
          }]' inline_response.json)
          
          # Save as raw JSON (no quotes or newline)
          echo "$COMMENTS_JSON" | jq . > review_comments.json

          echo "Posting comments..."
          gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
          -X POST \
          -f commit_id="$SHA" \
          -f event="COMMENT" \
          --raw-field comments="$(cat review_comments.json)"

